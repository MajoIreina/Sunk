[package]
name = "sunk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native Rust transparent black-hole desktop renderer"
license = "GPL-3.0-only"
repository = "https://github.com/MajoIreina/Sunk"

[dependencies]
bevy = "=0.19.1"
bevy_egui = { version = "=0.41.1", default-features = false, features = [
    "render",
    "default_fonts",
    "manage_clipboard",
] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.24.2", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
