name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release:
    name: Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/release/sunk.exe
          - os: macos-14
            binary: target/release/sunk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sunk-app --bin sunk --locked
      - name: Enforce Windows binary size
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/check-binary-size.ps1 -Path '${{ matrix.binary }}'
      - name: Enforce macOS binary size
        if: runner.os == 'macOS'
        run: ./tools/check-binary-size.sh '${{ matrix.binary }}'
